<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="lc"><circle cx="100" cy="100" r="96"/></clipPath>
    <!-- Radial gradient for leaf fronds: deep green at center → bright lime at tips -->
    <radialGradient id="leaf-g" cx="100" cy="100" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1C6638"/>
      <stop offset="30%"  stop-color="#2A9055"/>
      <stop offset="62%"  stop-color="#5ABE3A"/>
      <stop offset="100%" stop-color="#A0D428"/>
    </radialGradient>
  </defs>

  <!-- White background circle -->
  <circle cx="100" cy="100" r="96" fill="white"/>

  <g clip-path="url(#lc)">
    <!--
      KORU SPIRAL — three concentric arc bands in teal.
      Each band is a partial circle stroke (via stroke-dasharray).
      Rotated progressively so the "gap" always faces the right side (where the leaf lives),
      and the visible arc covers left/top/bottom — creating a tightening spiral inward.
    -->

    <!-- Band 1 · outermost · r=80 · 270° arc -->
    <!-- circumference ≈ 503 · dash=377 (270°) · gap=126 (90°) -->
    <!-- rotate(45°): stroke starts at 4:30, sweeps CW through bottom→left→top→upper-right -->
    <circle cx="100" cy="100" r="80"
      fill="none" stroke="#16707E" stroke-width="22"
      stroke-dasharray="377 126" stroke-linecap="round"
      transform="rotate(45 100 100)"/>

    <!-- Band 2 · middle · r=57 · 225° arc -->
    <!-- circumference ≈ 358 · dash=224 (225°) · gap=134 (135°) -->
    <!-- rotate(70°): starts slightly further around, tighter spiral -->
    <circle cx="100" cy="100" r="57"
      fill="none" stroke="#2AADA8" stroke-width="17"
      stroke-dasharray="224 134" stroke-linecap="round"
      transform="rotate(70 100 100)"/>

    <!-- Band 3 · innermost · r=36 · 175° arc -->
    <!-- circumference ≈ 226 · dash=110 (175°) · gap=116 (185°) -->
    <!-- rotate(95°): innermost curl facing left/upper-left -->
    <circle cx="100" cy="100" r="36"
      fill="none" stroke="#3DCFD0" stroke-width="12"
      stroke-dasharray="110 116" stroke-linecap="round"
      transform="rotate(95 100 100)"/>

    <!-- Koru center dot -->
    <circle cx="100" cy="100" r="6" fill="#2AADA8"/>

    <!--
      LEAF FRONDS — 5 ribs fanning right from center.
      Bezier curves give each frond a natural slight curve.
      Fronds are ordered top-to-bottom; outer fronds are thicker (like a real fern).
      Gradient runs deep-green at center → lime at tips.
    -->
    <path d="M 103,97  Q 138,68  170,28"
      stroke="url(#leaf-g)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 104,99  Q 148,80  188,56"
      stroke="url(#leaf-g)" stroke-width="9"  stroke-linecap="round"/>
    <path d="M 105,100 Q 150,100 193,100"
      stroke="url(#leaf-g)" stroke-width="8"  stroke-linecap="round"/>
    <path d="M 104,101 Q 148,120 188,144"
      stroke="url(#leaf-g)" stroke-width="9"  stroke-linecap="round"/>
    <path d="M 103,103 Q 138,132 170,172"
      stroke="url(#leaf-g)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Outer boundary ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2AADA8" stroke-width="2.5" opacity="0.35"/>
</svg>
